<!DOCTYPE html>
<html lang="vi" data-theme="dark" data-font="bookerly" data-size="24" data-width="medium">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phù Thủy Giả - Tiểu Thuyết Kỳ Ảo</title>
  
  <!-- Modern High-End Typography: Cormorant Upright & EB Garamond (100% Vietnamese Support) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=Cormorant+Upright:wght@400;600;700&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- GSAP & ScrollTrigger -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  
  <link rel="stylesheet" href="style.css?v=2.4">
</head>
<body>
  <!-- Ambient Atmospheric Background Layer (Adjustable Opacity) -->
  <div id="ambient-bg-layer" class="ambient-bg-layer"></div>

  <!-- Top Reading Scroll Progress -->
  <div id="progress-bar" class="progress-bar"></div>

  <!-- Floating Glass Header Navigation -->
  <header class="reader-header" id="reader-header">
    <div class="header-left">
      <button id="btn-home" class="action-btn" title="Trang chủ (H)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span class="btn-label">Trang chủ</span>
      </button>
      <button id="btn-toc" class="action-btn" title="Mục lục (M)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        <span class="btn-label">Mục lục</span>
      </button>
      <div class="header-book-info" id="nav-book-brand" title="Về trang chủ" style="cursor: pointer;">
        <span class="nav-novel-name">PHÙ THỦY GIẢ</span>
        <span class="nav-sep" id="nav-sep">/</span>
        <span class="nav-current-chapter" id="nav-chapter-title">Chương 1</span>
      </div>
    </div>

    <div class="header-right">
      <button id="btn-settings" class="action-btn icon-only" title="Tùy chỉnh hiển thị">
        <span class="aa-icon">Aa</span>
      </button>
      <button id="btn-fullscreen" class="action-btn icon-only" title="Toàn màn hình">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>
    </div>
  </header>

  <!-- Dynamic Viewport: Home Stage & Reading Stage -->
  <main id="app-viewport">
    <!-- Home Landing View (Hero Banner & Volume 3D Book Grid) -->
    <div id="home-stage" class="home-stage"></div>

    <!-- Chapter Reading View -->
    <div id="chapter-stage" class="chapter-stage" style="display: none;"></div>
  </main>

  <!-- Sidebar Drawer: Table of Contents -->
  <aside id="toc-drawer" class="drawer">
    <div class="drawer-header">
      <div class="drawer-title">
        <span class="symbol-dot"></span>
        <span>Mục Lục Tác Phẩm</span>
      </div>
      <button id="btn-close-toc" class="drawer-close">&times;</button>
    </div>
    
    <div class="drawer-search">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="toc-search" placeholder="Tìm kiếm chương...">
    </div>

    <nav class="drawer-body" id="toc-list">
      <!-- Injected by script.js -->
    </nav>
  </aside>

  <!-- Sidebar Drawer: Reader Display Preferences -->
  <aside id="settings-drawer" class="drawer settings-drawer">
    <div class="drawer-header">
      <div class="drawer-title">
        <span class="symbol-dot"></span>
        <span>Tùy Chỉnh Giao Diện</span>
      </div>
      <button id="btn-close-settings" class="drawer-close">&times;</button>
    </div>
    <div class="drawer-body settings-body">
      <!-- Theme Selection -->
      <div class="pref-group">
        <label class="pref-label">Tông màu giao diện</label>
        <div class="theme-grid">
          <button class="theme-card theme-dark active" data-theme="dark">
            <span class="swatch-color swatch-dark"></span>
            <div class="theme-meta">
              <span class="name">Hắc Thạch (Tối)</span>
              <span class="desc">Dịu mắt ban đêm</span>
            </div>
          </button>
          <button class="theme-card theme-stone" data-theme="stone">
            <span class="swatch-color swatch-stone"></span>
            <div class="theme-meta">
              <span class="name">Đá Trắng (Sáng)</span>
              <span class="desc">Hiện đại, thanh lịch</span>
            </div>
          </button>
          <button class="theme-card theme-sand" data-theme="sand">
            <span class="swatch-color swatch-sand"></span>
            <div class="theme-meta">
              <span class="name">Trang Thảo Mộc</span>
              <span class="desc">Ấm áp, êm dịu</span>
            </div>
          </button>
          <button class="theme-card theme-midnight" data-theme="midnight">
            <span class="swatch-color swatch-midnight"></span>
            <div class="theme-meta">
              <span class="name">Đêm Vô Tận</span>
              <span class="desc">Đen tuyền OLED</span>
            </div>
          </button>
        </div>
      </div>

      <!-- Typography Choice -->
      <div class="pref-group">
        <label class="pref-label">Kiểu chữ văn bản</label>
        <div class="pill-group">
          <button class="pill-btn active" data-font="bookerly">Bookerly (Kindle Chuẩn Sách)</button>
          <button class="pill-btn" data-font="garamond">EB Garamond</button>
          <button class="pill-btn" data-font="lora">Lora (Hiện đại)</button>
          <button class="pill-btn" data-font="modern">Plus Jakarta (Không chân)</button>
        </div>
      </div>

      <!-- Font Size Slider & Direct Input -->
      <div class="pref-group">
        <div class="pref-header-row">
          <label class="pref-label">Cỡ chữ đọc</label>
          <div class="input-unit-wrap">
            <input type="number" id="font-size-input" class="value-input" min="16" max="100" value="24" aria-label="Cỡ chữ">
            <span class="unit-label">px</span>
          </div>
        </div>
        <div class="slider-row">
          <button id="btn-font-dec" class="ctrl-step-btn" title="Giảm cỡ chữ">A-</button>
          <input type="range" id="font-size-slider" min="16" max="100" value="24" step="1">
          <button id="btn-font-inc" class="ctrl-step-btn" title="Tăng cỡ chữ">A+</button>
        </div>
      </div>

      <!-- Reading Width: Input + 3 Mốc đề xuất -->
      <div class="pref-group">
        <div class="pref-header-row">
          <label class="pref-label">Độ rộng cột chữ</label>
          <div class="input-unit-wrap">
            <input type="number" id="content-width-input" class="value-input" min="500" max="1600" step="10" value="760" aria-label="Độ rộng cột chữ">
            <span class="unit-label">px</span>
          </div>
        </div>
        <div class="slider-row width-slider-row">
          <input type="range" id="content-width-slider" min="500" max="1400" step="10" value="760">
        </div>
        <div class="pill-group" style="margin-top: 10px;">
          <button class="pill-btn" data-preset-width="660">Gọn (660px)</button>
          <button class="pill-btn active" data-preset-width="760">Vừa (760px)</button>
          <button class="pill-btn" data-preset-width="860">Rộng (860px)</button>
        </div>
      </div>

      <!-- Background Opacity Control -->
      <div class="pref-group">
        <div class="pref-header-row">
          <label class="pref-label">Độ mờ ảnh nền (Opacity)</label>
          <span class="value-badge" id="bg-opacity-val">0%</span>
        </div>
        <div class="slider-row">
          <input type="range" id="bg-opacity-slider" min="0" max="100" value="0" step="5">
        </div>
        <div class="pref-hint">0% là nền màu trơn. Kéo tăng để hiện mờ tranh minh họa chìm sau trang đọc.</div>
      </div>
    </div>
  </aside>

  <!-- Drawer Backdrop -->
  <div id="drawer-backdrop" class="drawer-backdrop"></div>

  <!-- Auto Bookmark Toast -->
  <div id="bookmark-toast" class="toast-card">
    <div class="toast-indicator"></div>
    <div class="toast-body">
      <span class="toast-heading">Tiếp tục hành trình</span>
      <p class="toast-sub" id="toast-desc">Bạn đang đọc dở Chương 1.</p>
    </div>
    <button id="btn-resume-reading" class="toast-action">Đọc tiếp</button>
    <button id="btn-dismiss-toast" class="toast-close">&times;</button>
  </div>

  <!-- Fullscreen Modern Lightbox -->
  <div id="lightbox" class="modern-lightbox">
    <div class="lightbox-overlay"></div>
    <div class="lightbox-container">
      <button id="lightbox-close-btn" class="lightbox-close" aria-label="Đóng">&times;</button>
      <div class="lightbox-frame">
        <img id="lightbox-image" src="" alt="Tranh minh họa">
      </div>
      <p id="lightbox-caption" class="lightbox-cap"></p>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="script.js?v=2.6"></script>
</body>
</html>
